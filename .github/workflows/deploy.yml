# push main → 檢查＋建置（正式階段：開放收錄、載入 GA）→ 部署到 GitHub Pages，網址 https://3jwellness.com。
# 自訂網域在 repo 的 Settings → Pages 設定（需 owner 權限），DNS 在 Porkbun。見 CLAUDE.md「環境與上線」。
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 排程文章在到期後的下一次建置公開；GitHub 排程可能延遲，不承諾整點。
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write      # deploy-pages
  id-token: write   # deploy-pages 的 OIDC

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # 部署到一半被砍會留下半套產出

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      PUBLIC_SITE_STAGE: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6          # 版本讀 package.json 的 packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 驗證內容公開範圍與子路徑
        if: github.event_name != 'schedule'
        run: pnpm verify:content
      - name: 檢查與建置（型別、字級、配色、連結、收錄設定）
        run: pnpm verify
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
